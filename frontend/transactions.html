<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction History | ApexTrust Bank</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Styling -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-wrapper">
    <!-- Sidebar Component -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <div class="main-content">
      <!-- Top Navbar -->
      <div id="top-navbar-container"></div>

      <!-- Page Container -->
      <main class="page-container">

        <!-- Page Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 g-3">
          <div>
            <h3 class="fw-bold text-navy mb-1">Transaction History & Statements</h3>
            <p class="text-muted-bank small mb-0">Search, filter, inspect and export your complete audit ledger.</p>
          </div>
          <div class="d-flex align-items-center gap-2 mt-2 mt-sm-0">
            <button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1" onclick="exportCsvStatement()">
              <i class="bi bi-download"></i> Download CSV Statement
            </button>
          </div>
        </div>

        <!-- Filter & Search Toolbar Card -->
        <div class="card bank-card p-3 p-md-4 border-0 shadow-sm mb-4">
          <form id="filter-form" class="row g-3 align-items-end">
            <!-- Search Keyword -->
            <div class="col-md-4">
              <label for="filter-search" class="form-label small fw-semibold text-navy">Search by Keyword or Ref</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control border-start-0" id="filter-search" placeholder="e.g. TXN-DEP, Rent, ATM...">
              </div>
            </div>

            <!-- Transaction Type Filter -->
            <div class="col-md-3">
              <label for="filter-type" class="form-label small fw-semibold text-navy">Filter by Type</label>
              <select class="form-select" id="filter-type">
                <option value="">All Transactions</option>
                <option value="DEPOSIT">Deposits</option>
                <option value="WITHDRAWAL">Withdrawals</option>
                <option value="TRANSFER_DEBIT">Transfers Sent (Debit)</option>
                <option value="TRANSFER_CREDIT">Transfers Received (Credit)</option>
              </select>
            </div>

            <!-- Date Range From -->
            <div class="col-md-2 col-sm-6">
              <label for="filter-start-date" class="form-label small fw-semibold text-navy">From Date</label>
              <input type="date" class="form-control" id="filter-start-date">
            </div>

            <!-- Date Range To -->
            <div class="col-md-2 col-sm-6">
              <label for="filter-end-date" class="form-label small fw-semibold text-navy">To Date</label>
              <input type="date" class="form-control" id="filter-end-date">
            </div>

            <!-- Apply & Reset Buttons -->
            <div class="col-md-1 d-flex gap-1">
              <button type="submit" class="btn btn-bank-primary w-100 p-2" title="Apply Filters">
                <i class="bi bi-funnel-fill"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary w-100 p-2" onclick="resetFilters()" title="Reset Filters">
                <i class="bi bi-x-circle"></i>
              </button>
            </div>
          </form>
        </div>

        <!-- Transactions Table Card -->
        <div class="card bank-card p-4 border-0 shadow-sm mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="small text-muted" id="results-count-text">Showing transactions...</span>
            <div class="d-flex align-items-center gap-2">
              <span class="small text-muted d-none d-sm-inline">Sort by:</span>
              <select class="form-select form-select-sm" id="sort-select" style="width: auto;">
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
                <option value="amount-desc">Highest Amount</option>
                <option value="amount-asc">Lowest Amount</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light text-muted small text-uppercase">
                <tr>
                  <th>Ref Number</th>
                  <th>Date & Time</th>
                  <th>Type</th>
                  <th>Description / Entity</th>
                  <th class="text-end">Debit</th>
                  <th class="text-end">Credit</th>
                  <th class="text-end">Balance After</th>
                  <th class="text-center">Status</th>
                </tr>
              </thead>
              <tbody id="transactions-table-body">
                <tr>
                  <td colspan="8" class="text-center py-4 text-muted">
                    <div class="spinner-border spinner-border-sm text-primary me-2"></div> Fetching records from database...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination Bar -->
          <div class="d-flex flex-wrap justify-content-between align-items-center pt-3 border-top mt-3" id="pagination-wrapper">
            <span class="small text-muted" id="page-info-text">Page 1 of 1</span>
            <ul class="pagination pagination-sm mb-0" id="pagination-list">
              <!-- Injected by JavaScript -->
            </ul>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Client Utilities -->
  <script src="js/config.js?v=3.0"></script>
  <!-- Transactions Script -->
  <script src="js/transactions.js"></script>
</body>
</html>
